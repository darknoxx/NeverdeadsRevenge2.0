[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neverdeads-revenge2"
version = "0.5.17"
description = "Neverdead's Revenge 2.0 -- the same dungeon, rendered as a CRT."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE"]
authors = [{ name = "darknoxx" }]
keywords = ["roguelite", "desktop", "sdl", "pygame", "crt", "game"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]

dependencies = ["pygame-ce>=2.5", "moderngl>=5.13", "miniaudio>=1.71"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    # The test suite is ten times slower on Windows than on Linux -- SDL and the
    # font atlas are paid for per process -- and the Windows build is where it
    # runs on every release. Parallel workers are four cores of a runner doing in
    # four minutes what one was doing in twelve.
    "pytest-xdist>=3.6",
]

[project.scripts]
ndr2 = "neverdeads_revenge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neverdeads_revenge"]
# The sound effects and the font are read at runtime, so they travel with the
# code rather than sitting in assets/ with the desktop file. Named explicitly so
# a future packaging change cannot quietly drop them.
# Everything the game *reads*: the sound effects, the face the screens are written
# in, and the art -- the sprites, the flagstones and the painting the arena stands
# in. Named explicitly so a packaging change cannot quietly drop one of them and
# leave a game that starts and then has no face.
include = [
    "src/neverdeads_revenge/sounds/*.wav",
    "src/neverdeads_revenge/desktop/fonts/*",
    "src/neverdeads_revenge/desktop/sprites/**/*.png",
    "src/neverdeads_revenge/desktop/tiles/*.png",
    "src/neverdeads_revenge/desktop/backdrops/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
