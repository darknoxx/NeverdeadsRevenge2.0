name: Windows build

# PyInstaller does not cross-compile, so the .exe is made on a Windows runner --
# which is the only reason this workflow exists. It also runs the test suite,
# because a Windows build that has never run the tests is a guess.
#
# The .exe is always attached as a workflow artifact. On a v* tag it is also
# attached to that release, so a tag is the whole release process again. It can
# also be run by hand (Actions -> Windows build -> Run workflow) with the tag as
# the ref, which attaches it to that release without a new tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Creating a release needs write access to the repository's contents; the
# default token is read-only on a repository configured that way, which is how
# the first tagged build failed at the last step after building fine.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # The tests drive a real window loop; the dummy driver means no display.
      SDL_VIDEODRIVER: dummy
      NEVERDEADS_REVENGE_MUTE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Test
        # Parallel, because the suite is ten times slower here than on Linux and
        # every second of it is on the critical path of a release. The slowest
        # tests are named in the log so that the next person can see where the
        # time goes rather than guess at it.
        run: python -m pytest -q -n auto --durations=10

      - name: Build the .exe
        run: pyinstaller packaging/windows/neverdeads_revenge.spec

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverdeadsRevenge2-windows
          path: dist/NeverdeadsRevenge2.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NeverdeadsRevenge2.exe
